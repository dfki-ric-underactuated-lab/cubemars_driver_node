variables:
  ROS_DISTRO: jazzy

image: ros:${ROS_DISTRO}-ros-base

stages:
  - build
  - test

before_script:
  - git config --global user.name "Gitlab Runner"
  - git config --global user.email "<>"
  - apt-get update
  - source /opt/ros/${ROS_DISTRO}/setup.bash
  - rosdep update --rosdistro $ROS_DISTRO
  - rosdep install --from-path . --rosdistro $ROS_DISTRO --default-yes 

Build:
  stage: build
  retry: 2
  script:
    - colcon build 
      --packages-up-to ${CI_PROJECT_NAME} 
      --symlink-install 
      --mixin coverage-gcc build-testing-on
      --event-handlers console_direct+ summary+ status- 
                   
  artifacts:
    paths:
      - 'build/'
      - 'install/'
    expire_in: 4 hrs

Test:
  stage: test
  script:
    - apt-get install lcov python3-colcon-lcov-result gcovr -y
    - source install/setup.bash
    - colcon test --packages-select ${CI_PROJECT_NAME} 
    - colcon test-result
    - gcovr --txt build/coverage.txt --xml-pretty -o build/cobertura-coverage.xml --exclude-unreachable-branches --print-summary --root ${CI_PROJECT_DIR} -e build/${CI_PROJECT_NAME}/CMakeFiles
    - cat build/coverage.txt     
  needs: 
    - job: Build
      artifacts: true
  coverage: '/^TOTAL.*\s+(\d+\%)$/'
  artifacts:
    when: always
    reports:
      junit: build/${CI_PROJECT_NAME}/test_results/${CI_PROJECT_NAME}/*.gtest.xml
      coverage_report:
        coverage_format: cobertura
        path: build/cobertura-coverage.xml
  