cubemars_hardware_node:
  ros__parameters:
    joints: ["joint_test", "joint_test1","joint_test2","joint_test3","joint_test4", "joint_test5"] #, "joint_test2", "joint_test3","joint_test4","joint_test5","joint_test6", "joint_test7"]
    default_damping_KD: 1.0
    watchdog_frequency: 10
    frequency: 1000
    can_socket_timeout_sec: 0
    can_socket_timeout_usec: 10000
    max_can_errors_before_motor_shutdown: 10

    # Communication backend per CAN interface: "cubemars" (classic CAN) or "mab" (CAN FD register
    # protocol). comm_backend_default applies to any interface not listed under can_backends.
    # NOTE: "mab" drives MAB electronics over CAN FD (the MAB register protocol). The interface must be
    # brought up in CAN FD mode. Invert, per-joint range clamping, MAB fault decoding and latency
    # timestamping are not wired up for the MAB backend yet (see docs/MAB_FDCAN_PARITY.md).
    comm_backend_default: cubemars
    can_backends:
      can0: cubemars
      can1: cubemars   # set to "mab" to drive this bus with MAB electronics (once supported)

    # joint_zero_positions: #Experimentally determined BY FRANEK
    #   - 0.0
    #   - -0.7
    #   - -2.2
    #   - -0.0
    #   - -0.7
    #   - -2.2

    #joint_zero_positions: [0.,-0.63,-2.205, 0.,-0.63,-2.205] #  From URDF determined BY HEINER

    #joint_zero_positions: [0.,0.,0.,0.,0.,0.]

    joint_defintions:
      joint_test:
        msg_idx: 0
        can_interface: "can0"
        can_id: 1
        motor_type: "AK80-8v3"
        tau_c: 0.0
        tau_s: 0.0
        v_s: 0.5
        k: 1.0
        b: 0.0
        set_zero_position_on_configure: false
        invert: false
        zero_position: 0.0

      joint_test1:
        msg_idx: 1
        can_interface: "can0"
        can_id: 2
        motor_type: "AK80-8v3"
        tau_c: 0.0
        tau_s: 0.0
        v_s: 0.5
        k: 1.0
        b: 0.0
        set_zero_position_on_configure: false
        invert: false
        zero_position: 0.0

      joint_test2:
        msg_idx: 2
        can_interface: "can0"
        can_id: 3
        motor_type: "AK10-9v3"
        tau_c: 0.0
        tau_s: 0.0
        v_s: 0.5
        k: 1.0
        b: 0.0
        set_zero_position_on_configure: false
        invert: false
        zero_position: 0.0

      joint_test3:
